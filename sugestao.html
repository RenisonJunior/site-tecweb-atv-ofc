<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugira um jogo | Jogos Bacanas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Jogos Bacanas</h1>
        <p>Jogos que vale a pena conhecer.</p>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="jogos.html">Jogos</a>
        <a href="sobre.html">Sobre</a>
        <a href="generos.html">Gêneros</a>
        <a href="sugestao.html">Sugira um jogo</a>
    </nav>

    <main>
        <section>
            <h2>Sugira um jogo</h2>
            <p>Preencha os campos abaixo para sugerir um jogo que deveria aparecer no site.</p>
            <form action="#" method="get">
                <p>
                    <label for="nome">Seu nome:</label><br>
                    <input type="text" id="nome" name="nome" required>
                </p>
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="nascimento">Data de nascimento:</label><br>
                    <input type="date" id="nascimento" name="nascimento" required>
                </p>
                <p>
                    <label for="jogo">Nome do jogo:</label><br>
                    <input type="text" id="jogo" name="jogo" required>
                </p>
                <p>
                    <label for="genero">Gênero:</label><br>
                    <select id="genero" name="genero">
                        <option value="">Selecione</option>
                        <option>Ação e aventura</option>
                        <option>Aventura narrativa</option>
                        <option>Mundo aberto</option>
                        <option>RPG</option>
                        <option>Outro</option>
                    </select>
                </p>
                <p>
                    <label for="descricao">Por que você recomenda esse jogo?</label><br>
                    <textarea id="descricao" name="descricao" rows="4"></textarea>
                </p>
                <p><button type="submit">Enviar sugestão</button></p>
            </form>
        </section>

    </main>
</body>
</html>
